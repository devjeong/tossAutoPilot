# Fly.io — TossAutoPilot engine worker
# fly launch / fly deploy 시 프로젝트에 맞게 app 이름을 바꾸세요.
app = "tosspilot-engine"
primary_region = "nrt"

[build]
  dockerfile = "apps/engine/Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
